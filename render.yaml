services:
  - type: web
    name: clipnest-downloader
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MAX_ACTIVE_DOWNLOADS
        value: "2"
      - key: FILE_TTL_SECONDS
        value: "3600"
